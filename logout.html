<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Logout</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-body">
<div class="auth-container">
  <div class="auth-box" style="text-align:center;">
    <h2 style="color:#fff;margin-bottom:20px;">Logout</h2>
    <p style="color:#8b93a7;margin-bottom:24px;">Aap pakka logout karna chahte hain?</p>
    <button class="btn-primary" style="width:100%;margin-bottom:10px;" onclick="doLogout()">Yes, Logout</button>
    <button class="btn-secondary" style="width:100%;" onclick="location.href='dashboard.html'">Cancel</button>
  </div>
</div>
<script type="module">
import { auth } from "./firebase-config.js";
import { signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
window.doLogout = async () => { await signOut(auth); location.href = "index.html"; };
</script>
</body></html>
