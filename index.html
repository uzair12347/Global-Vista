<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobalVest Capital - Smart Investment Platform</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
<div class="auth-container">
  <div class="auth-box">
    <div class="brand">
      <h1>GlobalVest <span>Capital</span></h1>
      <p>Grow Your Wealth Globally</p>
    </div>

    <div class="tabs">
  <button class="tab active" data-tab="login" onclick="showTab('login')">Login</button>
  <button class="tab" data-tab="register" onclick="showTab('register')">Register</button>
</div>

    <!-- LOGIN FORM -->
    <form id="loginForm" class="form active">
      <input type="email" id="loginEmail" placeholder="Email Address" required>
      <input type="password" id="loginPassword" placeholder="Password" required>
      <button type="submit" class="btn-primary">Login</button>
      <p id="loginMsg" class="msg"></p>
    </form>

    <!-- REGISTER FORM -->
    <form id="registerForm" class="form">
      <input type="text" id="regName" placeholder="Full Name" required>
      <input type="email" id="regEmail" placeholder="Email Address" required>
      <input type="tel" id="regPhone" placeholder="Phone Number (03XXXXXXXXX)" required>
      <input type="password" id="regPassword" placeholder="Password (min 6 chars)" required>
      <input type="text" id="regReferral" placeholder="Referral Code (Optional)">
      <button type="submit" class="btn-primary">Create Account</button>
      <p id="regMsg" class="msg"></p>
    </form>
  </div>
</div>

<script type="module">
import { auth, db } from "./firebase-config.js";
import { 
  createUserWithEmailAndPassword, 
  signInWithEmailAndPassword 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { 
  doc, setDoc, getDoc, collection, query, where, getDocs, serverTimestamp 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// Tab switching — window object par attach karein
window.showTab = function(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
  document.querySelector('.tab[data-tab="' + tab + '"]').classList.add('active');
  document.getElementById(tab + 'Form').classList.add('active');
};

// URL se referral code read karein
const params = new URLSearchParams(location.search);
if (params.get('ref')) {
  document.getElementById('regReferral').value = params.get('ref');
}

// REGISTER
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('regName').value;
  const email = document.getElementById('regEmail').value;
  const phone = document.getElementById('regPhone').value;
  const password = document.getElementById('regPassword').value;
  const refCode = document.getElementById('regReferral').value.trim();
  const msg = document.getElementById('regMsg');

  try {
    const userCred = await createUserWithEmailAndPassword(auth, email, password);
    const uid = userCred.user.uid;
    const myReferralCode = 'GV' + uid.substring(0, 6).toUpperCase();

    let referredBy = null;
    if (refCode) {
      const q = query(collection(db, "users"), where("referralCode", "==", refCode));
      const snap = await getDocs(q);
      if (!snap.empty) referredBy = snap.docs[0].id;
    }

    await setDoc(doc(db, "users", uid), {
      uid, name, email, phone,
      balance: 0,
      totalDeposit: 0,
      totalWithdraw: 0,
      totalProfit: 0,
      referralCode: myReferralCode,
      referredBy: referredBy,
      createdAt: serverTimestamp(),
      role: "user"
    });

    msg.style.color = "green";
    msg.textContent = "Registration successful! Redirecting...";
    setTimeout(() => location.href = "dashboard.html", 1500);
  } catch (err) {
    msg.style.color = "red";
    msg.textContent = err.message;
  }
});

// LOGIN
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const msg = document.getElementById('loginMsg');

  try {
    const cred = await signInWithEmailAndPassword(auth, email, password);
    const userDoc = await getDoc(doc(db, "users", cred.user.uid));
    if (userDoc.exists() && userDoc.data().role === "admin") {
      location.href = "admin.html";
    } else {
      location.href = "dashboard.html";
    }
  } catch (err) {
    msg.style.color = "red";
    msg.textContent = "Invalid email or password";
  }
});
</script>
</body>
</html>
