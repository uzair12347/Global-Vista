<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Team - GlobalVest Capital</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="navbar">
  <div class="logo">GlobalVest <span>Capital</span></div>
  <button class="btn-secondary" onclick="location.href='dashboard.html'">← Back</button>
</div>
<div class="main" style="margin-left:0;">
  <h1 class="page-title">My Team (3-Level Referrals)</h1>

  <div class="card">
    <h3 style="color:#fff;margin-bottom:12px;">Your Referral Link</h3>
    <div style="display:flex;gap:10px;">
      <input type="text" id="refLink" readonly style="padding:12px;background:#0a0e1a;border:1px solid #1f2b48;border-radius:8px;color:#f0b90b;flex:1;">
      <button class="btn-primary" onclick="copyLink()">Copy Link</button>
    </div>
  </div>

  <div class="card">
    <h3 style="color:#f0b90b;">Level 1 Members</h3>
    <table><thead><tr><th>Name</th><th>Phone</th><th>Joined</th></tr></thead><tbody id="l1"></tbody></table>
  </div>
  <div class="card">
    <h3 style="color:#94a3b8;">Level 2 Members</h3>
    <table><thead><tr><th>Name</th><th>Phone</th><th>Joined</th></tr></thead><tbody id="l2"></tbody></table>
  </div>
  <div class="card">
    <h3 style="color:#a855f7;">Level 3 Members</h3>
    <table><thead><tr><th>Name</th><th>Phone</th><th>Joined</th></tr></thead><tbody id="l3"></tbody></table>
  </div>
</div>

<script type="module">
import { auth, db } from "./firebase-config.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

onAuthStateChanged(auth, async (user) => {
  if (!user) return location.href = "index.html";
  const meSnap = await getDoc(doc(db, "users", user.uid));
  const myCode = meSnap.data().referralCode;
  document.getElementById('refLink').value = `${location.origin}${location.pathname.replace('team.html','index.html')}?ref=${myCode}`;

  const l1 = await getMembers(user.uid);
  render('l1', l1);
  const l2 = [];
  for (const m of l1) l2.push(...await getMembers(m.uid));
  render('l2', l2);
  const l3 = [];
  for (const m of l2) l3.push(...await getMembers(m.uid));
  render('l3', l3);
});

async function getMembers(uid) {
  const q = query(collection(db, "users"), where("referredBy", "==", uid));
  const snap = await getDocs(q);
  return snap.docs.map(d => d.data());
}

function render(id, members) {
  const tbody = document.getElementById(id);
  if (!members.length) { tbody.innerHTML = `<tr><td colspan="3" style="color:#8b93a7;text-align:center;">No members yet</td></tr>`; return; }
  tbody.innerHTML = members.map(m => `<tr>
    <td>${m.name}</td><td>${m.phone}</td>
    <td>${m.createdAt?.toDate?.().toLocaleDateString() || '-'}</td>
  </tr>`).join('');
}

window.copyLink = () => {
  const inp = document.getElementById('refLink');
  inp.select(); document.execCommand('copy');
  alert('Referral link copied!');
};
</script>
</body>
</html>
